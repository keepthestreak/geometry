</style></head><body><header><div class="brand"><div class="brandmark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div><h1>Square Lab</h1><p>Geometry · Squares & square roots</p></div></div><div class="toptools"><label class="motion"><input type="checkbox" id="motion">Reduce motion</label><button id="home">Explore</button></div></header><main class="shell" id="app"></main><footer>Go at your own pace. Hints and retries are part of learning. Progress stays in this browser.</footer>
<script>
'use strict';
const KEY='square-lab-v1';
const sections=[{name:'Squaring',start:0,end:6},{name:'Square roots',start:6,end:12},{name:'Calculator',start:12,end:16},{name:'Match',start:16,end:18},{name:'Mixed review',start:18,end:24}];
const field=(label,prefix,answer,suffix='')=>({label,prefix,answer,suffix});
const sq=n=>`${n}²`;
const compare=(n,title,extra='')=>({type:'compare',n,title,sub:extra||'Find both totals. Squaring means multiplying a number by itself.',fields:[field('Multiply by 2',`${n} × 2 =`,n*2),field('Square the number',`${n}² =`,n*n)],hints:[`The rectangle has 2 rows of ${n}. The square has ${n} rows of ${n}.`,`Doubling: ${n} + ${n}. Squaring: ${n} × ${n}.`,'Similar example: 8 × 2 = 16, while 8² = 8 × 8 = 64.'],success:`${n} × 2 = ${n*2}. ${n}² = ${n} × ${n} = ${n*n}.`});
const root=(n,level)=>({type:'root',n,title:level<3?'Find the missing side':'Find the square root',sub:`A square has area ${n*n} square units. What is its side length?`,fields:level<2?[field('Number for both boxes',`□ =`,n,`so □ × □ = ${n*n}`),field('Side length',`√${n*n} =`,n,'units')]:[field('Side length',`√${n*n} =`,n,'units')],hints:[`The area is ${n*n}. You need a side length.`,`Find one number that fills both blanks: □ × □ = ${n*n}.`,'Similar example: a square with area 25 has side 5, because 5 × 5 = 25.'],success:`√${n*n} = ${n}. Check: ${n} × ${n} = ${n*n}.`});
const calc=(n,isRoot=false)=>({type:'calc',n,isRoot,title:isRoot?'Calculator: Square root':'Calculator: Square',sub:isRoot?'Enter the expression, then check by multiplying your answer by itself.':'Predict the size of the answer, then use your calculator.',fields:[field('Your answer',isRoot?`√${n} =`:`${n}² =`,isRoot?Math.sqrt(n):n*n)],hints:[isRoot?'Use the square-root key, √.':'Use x², or multiply the number by itself.',isRoot?`Check that your answer × your answer equals ${n}.`:`Enter ${n} × ${n}.`,'Similar example: 11² = 121 and √121 = 11.'],success:isRoot?`√${n} = ${Math.sqrt(n)}. Check: ${Math.sqrt(n)} × ${Math.sqrt(n)} = ${n}.`:`${n}² = ${n} × ${n} = ${n*n}.`});
const match=n=>({type:'match',n,title:'Do these cards have the same answer?',sub:'Calculate each card. A pair needs one square and one square root.',fields:[field('Square card',`${n}² =`,n*n),field('Square-root card',`√${n**4} =`,n*n)],hints:[`The square card asks for ${n} × ${n}.`,'Use your calculator for the square root. Then multiply that answer by itself to check.','Similar pair: 3² = 9 and √81 = 9. Both answers are 9.'],success:`A match! Both cards equal ${n*n}.`});
const Q=[compare(3,'Multiply by 2 or square?'),compare(4,'Same number, different operations'),compare(5,'Find both answers'),{...compare(6,'Find the mistake','A student wrote “6² = 12.” Show the correct multiplication and answer.'),fields:[field('Complete the multiplication','6² = 6 ×',6),field('Correct value','6² =',36)],success:'6² = 6 × 6 = 36. The answer 12 comes from 6 × 2.'},{type:'expand',n:7,title:'What does the exponent mean?',sub:'Choose the multiplication that means 7². Then find its value.',fields:[field('Value','7² =',49)],hints:['Squared means the same number times itself.','In 7², both factors are 7.','Similar example: 9² means 9 × 9, which equals 81.'],success:'7² means 7 × 7 = 49.'},compare(2,'A special case: The number 2','Find both answers. This time the two operations have the same result.'),...([3,4,6,7,8,10].map((n,i)=>root(n,i))),calc(12),calc(2.5),calc(625,true),calc(1296,true),match(4),match(6),{type:'square',n:8,title:'Mixed review: Square',sub:'Write the multiplication in your notebook, then enter the answer.',fields:[field('Value','8² =',64)],hints:['A square has equal side lengths.','8² means 8 × 8.','Similar example: 6² = 6 × 6 = 36.'],success:'8² = 8 × 8 = 64.'},root(9,3),compare(9,'Mixed review: Doubling and squaring'),root(11,4),{...root(12,5),title:'A square garden',units:'square meters',sub:'A square garden has area 144 square meters. Find its side length.',fields:[field('Side length','√144 =',12,'meters')]},{type:'decimal',n:30,title:'One last question: A decimal root',sub:'Use your calculator. Round the answer to the nearest tenth.',fields:[field('Nearest tenth','√30 ≈',5.5)],hints:['25 < 30 < 36, so the side is between 5 and 6.','Enter √30. For the nearest tenth, look at the hundredths digit.','Similar example: √20 = 4.472… rounds to 4.5 because the hundredths digit is 7.'],success:'√30 = 5.477… ≈ 5.5. The hundredths digit, 7, rounds the tenths up.'}];
Q[5].success='Both answers are 4. Here 2 × 2 and 2² use the same factors. For 3, doubling gives 6 and squaring gives 9.';
let state={index:0,records:Q.map(()=>({done:false,attempts:0,hints:0,values:[],choice:null})),motion:false};let storageWorks=true;try{const data=JSON.parse(localStorage.getItem(KEY));if(data&&data.records?.length===24&&Number.isInteger(data.index)&&data.index>=0&&data.index<24&&data.records.every(r=>typeof r.done==='boolean'&&Number.isInteger(r.attempts)&&Number.isInteger(r.hints)))state=data;}catch(e){storageWorks=false;}let page='intro',exploreN=4,playing=0;
const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageWorks=false;}}
function count(){return state.records.filter(r=>r.done).length;}
function unlocked(){const i=state.records.findIndex(r=>!r.done);return i<0?23:i;}
function setMotion(){document.body.classList.toggle('reduced',!!state.motion);document.getElementById('motion').checked=!!state.motion;}
document.getElementById('motion').onchange=e=>{state.motion=e.target.checked;setMotion();save();};document.getElementById('home').onclick=()=>intro();setMotion();
function grid(cols,rows,x,y,u,{first=true,hidden=false,total=false}={}){let s='';for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)s+=`<rect class="tile ${first&&r===0?'first':''}" x="${x+c*u}" y="${y+r*u}" width="${u}" height="${u}" style="--delay:${r*.22}s"/>`;s+=`<rect class="boundary" x="${x}" y="${y}" width="${cols*u}" height="${rows*u}"/>`;if(!hidden)s+=`<text class="dim" x="${x+cols*u/2}" y="${y+rows*u+30}" text-anchor="middle">${cols}</text><text class="dim" x="${x-15}" y="${y+rows*u/2+7}" text-anchor="end">${rows}</text>`;if(total)s+=`<text class="total" x="${x+cols*u/2}" y="${y+rows*u+67}" text-anchor="middle">${rows*cols} tiles</text>`;return s;}
function svg(content,label,view='0 0 560 310'){return `<svg viewBox="${view}" role="img" aria-label="${esc(label)}">${content}</svg>`;}
function compareVisual(n){let u=Math.min(62,188/n),base=232;return svg(`<text class="diagramtext" x="140" y="35" text-anchor="middle">${n} × 2</text><text class="diagramtext" x="420" y="35" text-anchor="middle">${n}² = ${n} × ${n}</text>${grid(n,2,140-n*u/2,base-2*u,u,{total:true})}${grid(n,n,420-n*u/2,base-n*u,u,{total:true})}`,`${n} by 2 rectangle beside a ${n} by ${n} square, drawn to the same scale.`);}
function rootVisual(n,solved=false,hinted=false,units='square units'){let u=210/n;let content=solved||hinted?grid(n,n,175,35,u,{first:false,hidden:!solved}):`<rect class="rootarea" x="175" y="35" width="210" height="210"/><text class="rootlabel" x="280" y="131" text-anchor="middle">${n*n}</text><text class="diagramtext" x="280" y="162" text-anchor="middle">${units}</text>`;if(!solved)content+=`<text class="dim" x="280" y="280" text-anchor="middle">Side = ?</text>`;return svg(content,`Square with area ${n*n}; find the side length.`);}
function visual(q,r){if(q.type==='compare')return compareVisual(q.n);if(q.type==='square'||q.type==='expand')return svg(grid(q.n,q.n,175,28,210/q.n,{total:true}),`Square with side length ${q.n}.`);if(q.type==='root')return rootVisual(q.n,r.done,r.hints>=2,q.units);if(q.type==='match')return `<div class="pairmath"><span>${q.n}²</span><span>√${q.n**4}</span></div>${svg(`<path d="M130 25 L130 70 L430 70 L430 25" fill="none" stroke="${r.done?'#237151':'#d9dfdf'}" stroke-width="3"/><text x="280" y="125" text-anchor="middle" class="diagramtext">${r.done?'Same answer: '+q.n*q.n:'Find each answer first'}</text>`,`Two expression cards to compare.`,'0 0 560 150')}`;if(q.type==='decimal')return svg(`<text class="diagramtext" x="280" y="60" text-anchor="middle">25 &lt; 30 &lt; 36</text><line x1="80" x2="480" y1="160" y2="160" stroke="#17324d" stroke-width="2"/><text class="dim" x="80" y="200" text-anchor="middle">5</text><text class="dim" x="480" y="200" text-anchor="middle">6</text><text class="diagramtext" x="80" y="235" text-anchor="middle">5² = 25</text><text class="diagramtext" x="480" y="235" text-anchor="middle">6² = 36</text>${r.done?'<circle cx="271" cy="160" r="7" fill="#af5819"/><text class="diagramtext" x="271" y="130" text-anchor="middle">√30 ≈ 5.5</text>':''}`,'Square root of 30 lies between 5 and 6.');return `<div class="big-root">${q.isRoot?'√'+q.n:q.n+'²'}</div><div class="calcflow">${(q.isRoot?['√',String(q.n)]:[String(q.n),'×',String(q.n),'=']).map(x=>`<span>${x}</span>`).join('')}</div><div class="pair-check">${r.done?esc(q.success):'Enter the expression on your calculator.'}</div>`;}
function animate(){const model=document.getElementById('model');if(!model)return;playing++;model.classList.add('revealed');const cells=model.querySelectorAll('.tile');cells.forEach(e=>e.classList.remove('reveal'));void model.offsetWidth;cells.forEach(e=>e.classList.add('reveal'));const keys=model.querySelectorAll('.calcflow span');keys.forEach((e,i)=>{e.classList.remove('keyactive');setTimeout(()=>{if(e.isConnected)e.classList.add('keyactive')},state.motion?0:i*280);});}
function intro(){page='intro';const c=count();app.innerHTML=`<div class="hero"><section><p class="eyebrow">See it. Try it. Understand it.</p><h2>A little square.<br>A big idea.</h2><p class="lead">Build squares with tiles. Discover what squaring means, then work backward with square roots.</p><p class="tagline">24 questions. One step at a time. No timer.</p><button class="primary" id="start">${c===24?'View my results':c?'Continue practice':'Start practice'} <span aria-hidden="true">→</span></button>${c?`<p class="tagline">${c} of 24 questions completed</p>`:''}<details><summary>How it works</summary><p>Try each answer first. Use up to three hints. Correct your work, then select Next. At the end, show your teacher your results for a log-page stamp.</p></details></section><section class="explorebox"><h3>Explore before you start</h3><p class="tagline" style="margin:4px 0 6px">Change the side. Predict the number of tiles.</p><div id="model">${svg(grid(exploreN,exploreN,175,20,210/exploreN,{first:true}),`A square with side ${exploreN}.`)}</div><div class="sliderline"><label for="side">Side</label><input type="range" id="side" min="1" max="10" value="${exploreN}"><output id="sideout">${exploreN}</output></div><div class="buttons" style="margin:16px 0 6px"><button id="tiles">Show tiles</button></div><div class="exploreanswer" id="exploreanswer" aria-live="polite"></div></section></div><div class="intro-bottom"><div><strong>6</strong>Squaring questions</div><div><strong>6</strong>Square roots</div><div><strong>4</strong>Calculator questions</div><div><strong>2</strong>Matching pairs</div><div><strong>6</strong>Mixed review</div></div>${!storageWorks?'<p class="notice">Your browser cannot save progress. Keep this tab open while you work.</p>':''}`;document.getElementById('side').oninput=e=>{exploreN=Number(e.target.value);document.getElementById('sideout').textContent=exploreN;document.getElementById('model').innerHTML=svg(grid(exploreN,exploreN,175,20,210/exploreN,{first:true}),`A square with side ${exploreN}.`);document.getElementById('exploreanswer').textContent='';};document.getElementById('tiles').onclick=()=>{animate();document.getElementById('exploreanswer').textContent=`${exploreN}² = ${exploreN} × ${exploreN} = ${exploreN*exploreN}`;};document.getElementById('start').onclick=()=>{if(c===24)summary();else{state.index=unlocked();render();}};}
function capture(){const r=state.records[state.index];if(r.done)return;r.values=Q[state.index].fields.map((_,i)=>document.getElementById('answer'+i)?.value||'');save();}
function render(focus=false){page='practice';const i=state.index,q=Q[i],r=state.records[i],section=sections.find(s=>i>=s.start&&i<s.end);const caption=q.type==='compare'?'The tile size is the same in both models.':q.type==='root'?'Area measures the space inside. Side length measures one edge.':q.type==='calc'?'Calculator layouts differ. Ask your teacher to show the √ or x² key.':'Use the model to explain your calculation.';app.innerHTML=`<div class="rail"><span>${section.name}</span><span>${count()} / 24 completed</span></div><div class="progress" role="progressbar" aria-label="Questions completed" aria-valuenow="${count()}" aria-valuemin="0" aria-valuemax="24"><div style="width:${count()/24*100}%"></div></div><nav class="stages" aria-label="Practice sections">${sections.map(s=>`<button data-go="${s.start}" class="${s===section?'current':state.records.slice(s.start,s.end).every(x=>x.done)?'done':''}" ${s.start>unlocked()?'disabled':''}>${s.name} ${s.end-s.start}</button>`).join('')}</nav><div class="question-head"><p class="eyebrow">Question ${i+1} of 24</p><h2 id="question-title" tabindex="-1">${q.title}</h2><p>${q.sub}</p></div><div class="workspace"><section class="visual" aria-label="Visual model"><div class="visual-title"><span>${q.type==='compare'?'COMPARE THE MODELS':q.type==='match'?'MATCH THE ANSWERS':'VISUAL MODEL'}</span><button id="replay" ${!r.done?'disabled':''}>Replay animation</button></div><div class="model ${r.hints?'hinted':''}" id="model">${visual(q,r)}</div><div class="model-caption">${caption}</div></section><section class="answer-area" aria-label="Your answers">${i<6?'<div class="rule">Squared = the number × itself</div>':''}${['calc','match','decimal'].includes(q.type)?'<span class="calculator-tag">Calculator welcome</span>':''}<form id="answerform" novalidate>${q.type==='expand'?`<fieldset style="border:0;padding:0;margin:0 0 20px"><legend style="font-size:17px;margin-bottom:9px">Which multiplication means 7²?</legend><div class="buttons"><button type="button" data-choice="49" aria-pressed="${r.choice===49}" ${r.done?'disabled':''} style="${r.choice===49?'background:#e5f3e9;border-color:#237151':''}">7 × 7</button><button type="button" data-choice="14" aria-pressed="${r.choice===14}" ${r.done?'disabled':''} style="${r.choice===14?'background:#fff0dc;border-color:#af5819':''}">7 × 2</button></div></fieldset>`:''}${q.fields.map((f,j)=>`<div class="field"><label for="answer${j}">${f.label}</label><div class="inputline"><span class="math">${f.prefix}</span><input id="answer${j}" name="answer${j}" type="text" inputmode="decimal" autocomplete="off" aria-label="${esc(f.label+' '+f.prefix)}" value="${esc(r.done?f.answer:r.values[j]||'')}" ${r.done?'disabled':''}>${f.suffix?`<small>${esc(f.suffix)}</small>`:''}</div></div>`).join('')}<div class="buttons"><button type="submit" class="primary" ${r.done?'disabled':''}>Check answer${q.fields.length>1?'s':''}</button><button type="button" id="hint" ${r.done||r.hints>=3?'disabled':''}>Hint${r.hints?' '+r.hints+'/3':''}</button></div></form><div id="feedback" class="feedback ${r.done?'good':''}" role="status" aria-live="polite">${r.done?'✓ '+q.success:''}</div>${r.hints?`<div class="hintbox"><h3>Your hints</h3>${q.hints.slice(0,r.hints).map((h,j)=>`<p><strong>${j+1}.</strong> ${h}</p>`).join('')}</div>`:''}</section></div><div class="nextrow"><button id="back" ${i===0?'disabled':''}>← Previous</button><span>${r.done?'Ready when you are.':'Try your answer, or ask for a hint.'}</span><button id="next" class="primary" ${r.done?'':'disabled'}>${i===23?'See my results':'Next question →'}</button></div>${!storageWorks?'<p class="notice">Progress cannot be saved in this browser. Keep this tab open.</p>':''}`;
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{capture();state.index=+b.dataset.go;save();render(true);});document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{capture();r.choice=+b.dataset.choice;save();render();});q.fields.forEach((f,j)=>document.getElementById('answer'+j).oninput=()=>capture());document.getElementById('answerform').onsubmit=e=>{e.preventDefault();check();};document.getElementById('hint').onclick=()=>{capture();r.hints=Math.min(3,r.hints+1);save();render();if(q.type==='root'&&r.hints>=2)animate();};document.getElementById('replay').onclick=animate;document.getElementById('back').onclick=()=>{capture();state.index--;save();render(true);};document.getElementById('next').onclick=()=>{if(!r.done)return;if(i===23)summary();else{state.index++;save();render(true);}};if(r.done||q.type==='root'&&r.hints>=2)animate();if(focus){document.getElementById('question-title').focus();window.scrollTo({top:0,behavior:state.motion?'instant':'smooth'});}}
function number(v){return /^[-+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(v.trim())?Number(v):NaN;}
function check(){const q=Q[state.index],r=state.records[state.index];if(r.done)return;capture();const vals=r.values.map(number),fb=document.getElementById('feedback');if(vals.some(x=>!Number.isFinite(x))||(q.type==='expand'&&r.choice===null)){fb.className='feedback error';fb.textContent='Fill in each answer'+(q.type==='expand'?' and choose a multiplication':'')+' first. Use numbers only.';return;}r.attempts++;const ok=vals.every((v,j)=>Math.abs(v-q.fields[j].answer)<1e-8)&&(q.type!=='expand'||r.choice===49);if(ok){r.done=true;save();render();}else{save();fb.className='feedback error';if((q.type==='compare'&&vals[vals.length-1]===q.n*2&&q.n!==2)||(q.type==='square'&&vals[0]===q.n*2)||(q.type==='expand'&&r.choice===14))fb.textContent=`Squaring means ${q.n} × ${q.n}. Multiplying by 2 doubles the number. Try again.`;else if(q.type==='root'&&vals.some(v=>v===q.n*q.n))fb.textContent='That is the area. Find the side: what number times itself gives this area?';else if(q.type==='decimal'&&vals[0]>5&&vals[0]<6)fb.textContent='You are between 5 and 6. Now round to one digit after the decimal point.';else if(q.fields.length>1&&vals.some((v,j)=>v===q.fields[j].answer))fb.textContent='One part is correct. Check the other calculation, then try again.';else fb.textContent='Check the operation and try again. A hint can help you choose your next step.';}}
function summary(){page='summary';const done=count(),first=state.records.filter(r=>r.done&&r.attempts===1).length,corrected=state.records.filter(r=>r.done&&r.attempts>1).length,hints=state.records.filter(r=>r.hints>0).length;app.innerHTML=`<section class="summary"><p class="eyebrow">Your practice summary</p><h2>${done===24?'You finished Square Lab.':'Your progress so far'}</h2><p class="stampnote">${done===24?'Show your teacher this screen for your log-page stamp.':'Complete all 24 questions, then show your teacher your results.'}</p><div class="stats"><div><strong>${done}/24</strong><span>Completed</span></div><div><strong>${first}</strong><span>Correct on first check</span></div><div><strong>${corrected}</strong><span>Corrected with retries</span></div><div><strong>${hints}</strong><span>Questions with hints</span></div></div><table><thead><tr><th>Section</th><th>Completed</th><th>Revisit</th></tr></thead><tbody>${sections.map(s=>`<tr><td>${s.name}</td><td>${state.records.slice(s.start,s.end).filter(r=>r.done).length} / ${s.end-s.start}</td><td><button class="link" data-review="${s.start}">Review</button></td></tr>`).join('')}</tbody></table><p class="save-note">First-check results may include hints. This is a practice summary, not a test grade. Progress is stored only in this browser.</p><div class="buttons" style="margin-top:24px"><button id="print">Print results</button><button id="reset">Start a new attempt</button></div><div id="resetbox" class="resetbox" hidden><p>Start over? This clears the current practice results on this browser.</p><div class="buttons"><button class="primary" id="confirmreset">Yes, start over</button><button id="cancelreset">Keep my results</button></div></div></section>`;document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{state.index=+b.dataset.review;save();render(true);});document.getElementById('print').onclick=()=>window.print();document.getElementById('reset').onclick=()=>document.getElementById('resetbox').hidden=false;document.getElementById('cancelreset').onclick=()=>document.getElementById('resetbox').hidden=true;document.getElementById('confirmreset').onclick=()=>{state.records=Q.map(()=>({done:false,attempts:0,hints:0,values:[],choice:null}));state.index=0;save();intro();};window.scrollTo({top:0,behavior:'instant'});}
intro();
</script></body></html>
